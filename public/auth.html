<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Adega Delivery</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="card">
                <div class="card-content">
                    <div class="logo-container center-align">
                        <a href="/" class="brand-logo">
                            <span class="logo">🍷</span>
                            <h4 class="brand-title">Adega Delivery</h4>
                        </a>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <!-- Tabs de Login/Registro -->
                    <div class="section">
                        <div class="row">
                            <div class="col s12">
                                <ul class="tabs">
                                    <li class="tab col s6"><a class="active" href="#login">Login</a></li>
                                    <li class="tab col s6"><a href="#register">Cadastro</a></li>
                                </ul>
                            </div>

                            <!-- Login Form -->
                            <div id="login" class="col s12">
                                <form id="login-form" class="auth-form">
                                    <div class="input-field">
                                        <i class="material-icons prefix">email</i>
                                        <input id="login-email" type="email" class="validate" required>
                                        <label for="login-email">Email</label>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">lock</i>
                                        <input id="login-password" type="password" class="validate" required>
                                        <label for="login-password">Senha</label>
                                    </div>
                                    <div class="center-align">
                                        <button type="submit" class="btn-large waves-effect waves-light red accent-2">
                                            Entrar
                                            <i class="material-icons right">login</i>
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Register Form -->
                            <div id="register" class="col s12">
                                <form id="register-form" class="auth-form">
                                    <div class="input-field">
                                        <i class="material-icons prefix">person</i>
                                        <input id="register-name" type="text" class="validate" required>
                                        <label for="register-name">Nome Completo</label>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">email</i>
                                        <input id="register-email" type="email" class="validate" required>
                                        <label for="register-email">Email</label>
                                        <span class="helper-text">Você receberá um código de verificação neste email</span>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">phone</i>
                                        <input id="register-phone" type="tel" class="validate" pattern="[0-9]{11}" required>
                                        <label for="register-phone">Telefone</label>
                                        <span class="helper-text">DDD + Número (Ex: 11999999999)</span>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">badge</i>
                                        <input id="register-cpf" type="text" class="validate" pattern="[0-9]{11}" required>
                                        <label for="register-cpf">CPF</label>
                                        <span class="helper-text">Apenas números</span>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">cake</i>
                                        <input id="register-birthdate" type="date" class="validate" required>
                                        <label for="register-birthdate">Data de Nascimento</label>
                                    </div>
                                    <div class="input-field">
                                        <i class="material-icons prefix">lock</i>
                                        <input id="register-password" type="password" class="validate" required>
                                        <label for="register-password">Senha</label>
                                        <span class="helper-text">Mínimo de 6 caracteres</span>
                                    </div>
                                    <div class="center-align">
                                        <button type="submit" class="btn-large waves-effect waves-light red accent-2">
                                            Cadastrar e Verificar Email
                                            <i class="material-icons right">person_add</i>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Modal de Verificação (atualizado) -->
                    <div id="verification-modal" class="modal">
                        <div class="modal-content">
                            <h4>Verificação de Email</h4>
                            <p>Digite o código de 6 dígitos enviado para seu email:</p>
                            <div class="input-field">
                                <input id="verification-code" type="text" class="validate" pattern="[0-9]{6}" maxlength="6" required>
                                <label for="verification-code">Código de Verificação</label>
                            </div>
                            <div class="center-align" style="margin-top: 20px;">
                                <button id="resend-code-btn" class="waves-effect waves-light btn-flat">
                                    Reenviar Código
                                </button>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="modal-close waves-effect waves-light btn-flat">Cancelar</button>
                            <button id="verify-code-btn" class="waves-effect waves-light btn red accent-2">
                                Verificar
                                <i class="material-icons right">check</i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
